name: Build SelyApp APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SelyApp.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q SelyApp.zip -d project

      - name: Find Android project
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SelyApp-APK
          path: '**/build/outputs/apk/**/*.apk'
